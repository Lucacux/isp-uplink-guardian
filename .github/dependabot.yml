version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Se actualiza a mano junto con la imagen base (ver README → Playwright).
      # tests/test_playwright_pin.py rechaza cualquier PR que los desincronice.
      - dependency-name: playwright

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must be upgraded together with requirements.txt.
      - dependency-name: mcr.microsoft.com/playwright/python
