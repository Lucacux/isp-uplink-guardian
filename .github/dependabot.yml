version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Must be upgraded together with the Dockerfile base image.
      - dependency-name: playwright

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must be upgraded together with requirements.txt.
      - dependency-name: mcr.microsoft.com/playwright/python
